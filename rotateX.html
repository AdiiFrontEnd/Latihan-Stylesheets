<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <h1>Halah Nyocot</h1>
        <p>Halah Berak</p>
    </div>
</body>
</html>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

    }
    body {
        width: 100%;
        height: 1000px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .box {
 
        width: 200px;
        height: 200px;
        padding: 20px;
        background-color: #171717;
        color: white;
        border-radius: 20px;
        transform: rotateX(180deg);
    }
</style>
